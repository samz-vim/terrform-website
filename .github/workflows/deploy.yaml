name: CD 

on:
  repository_dispatch:
    types: [ci-complete]
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

  workflow_dispatch:

jobs:

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    # Only deploy when CI was successful
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Download Terraform output
        uses: actions/download-artifact@v4
        with:
          name: terraform-output
            
      - name: Read EC2 IP
        id: ec2
        run: |
          echo "EC2_IP=$(cat ec2_ip.txt)" >> "$GITHUB_ENV"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Deploy to EC2
        env:
          EC2_IP: ${{ github.event.client_payload.ec2_ip }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          mkdir -p ~/.ssh
      
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
      
          echo "Deploying to $EC2_IP"
      
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key \
            $EC2_USER@$EC2_IP \
            "docker pull $DOCKER_USERNAME/my-website:latest && \
             docker stop my-website || true && \
             docker rm my-website || true && \
             docker run -d \
             --name my-website \
             -p 80:80 \
             $DOCKER_USERNAME/my-website:latest"
          
            echo "================================="
            echo "Deployment completed successfully"
            echo "================================="

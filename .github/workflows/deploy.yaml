name: CD 

on:
  repository_dispatch:
    types: [ci-complete]
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

  workflow_dispatch:

jobs:

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    # Only deploy when CI was successful
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Find Terraform files
      run: |
        echo "Current directory:"
        pwd
    
        echo ""
        echo "Files in repository:"
        find . -maxdepth 4 -type f | sort
    
        echo ""
        echo "Terraform files:"
        find . -name "*.tf" -type f

    - name: Verify Terraform Provider
      run: |
        echo "Terraform version:"
        terraform version
    
        echo ""
        echo "Installed providers:"
        terraform providers
    
        echo ""
        echo "Provider files:"
        find .terraform/providers -type f | head -50

    - name: Terraform Init
      working-directory: ./terraform
      run: |
        rm -rf .terraform
        terraform init -upgrade -reconfigure \
          -backend-config="region=${{ secrets.AWS_REGION }}"
    
    - name: Get EC2 IP
      working-directory: ./terraform
      run: |
        echo "Getting EC2 public IP from Terraform state..."
    
        EC2_IP=$(terraform output -raw instance_public_ip)
    
        echo "================================="
        echo "EC2 IP:"
        echo "$EC2_IP"
        echo "================================="
    
        echo "EC2_IP=$EC2_IP" >> "$GITHUB_ENV"
        - name: Configure SSH
          run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key
            chmod 600 ~/.ssh/ec2_key

    - name: Deploy to EC2
      env:
        EC2_IP: ${{ github.event.client_payload.ec2_ip }}
        EC2_USER: ${{ secrets.EC2_USER }}
        DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      run: |
        mkdir -p ~/.ssh
    
        echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key
        chmod 600 ~/.ssh/ec2_key
    
        echo "Deploying to $EC2_IP"
    
        ssh -o StrictHostKeyChecking=no \
          -i ~/.ssh/ec2_key \
          $EC2_USER@$EC2_IP \
          "docker pull $DOCKER_USERNAME/my-website:latest && \
           docker stop my-website || true && \
           docker rm my-website || true && \
           docker run -d \
           --name my-website \
           -p 80:80 \
           $DOCKER_USERNAME/my-website:latest"
        
          echo "================================="
          echo "Deployment completed successfully"
          echo "================================="
